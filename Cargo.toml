[package]
name = "fission-web"
version = "0.1.7"
edition = "2021"
description = "Fission decompiler — browser-native interface (Dioxus WASM)"
repository = "https://github.com/fission-systems/fission-web"
license = "AGPL-3.0-or-later"

[[bin]]
name = "fission-web"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-logger = "0.7"
tracing = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "File", "FileList", "FileReader",
  "HtmlInputElement", "Event", "EventTarget",
  "DragEvent", "DataTransfer",
  "ProgressEvent",
  "console",
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = { version = "0.6", features = ["http"] }
console_error_panic_hook = "0.1"

# Fission shared UI — git dependency (includes state, engine, components).
# Pinned to an exact commit, not the v0.1.7 tag: 9f7ad9e1 fixes a critical
# bug (sidebar/editor stuck on "no binary loaded" on the cloud/web backend
# forever, even after a fully successful upload+functions fetch -- see that
# commit) that's worth shipping now rather than waiting for the next
# tagged Fission release. Switch back to `tag = "vX.Y.Z"` (dropping `rev`)
# once a release containing this fix ships.
fission-ui = { git = "https://github.com/fission-systems/Fission", rev = "9f7ad9e1b8f0a8fa2eca7b37535bf8b5a7fd3de5", default-features = false }

[profile.release]
opt-level = "z"     # minimize WASM size
lto = true
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
