[package]
name = "fission-web"
version = "0.1.7"
edition = "2021"
description = "Fission decompiler — browser-native interface (Dioxus WASM)"
repository = "https://github.com/fission-systems/fission-web"
license = "AGPL-3.0-or-later"

[[bin]]
name = "fission-web"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-logger = "0.7"
tracing = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "File", "FileList", "FileReader",
  "HtmlInputElement", "Event", "EventTarget",
  "DragEvent", "DataTransfer",
  "ProgressEvent",
  "console",
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = { version = "0.6", features = ["http"] }
console_error_panic_hook = "0.1"

# Fission shared UI — git dependency (includes state, engine, components).
# Pinned to an exact commit, not the v0.1.7 tag: fixes several critical
# post-release bugs on the cloud/web backend found live in production
# (sidebar/editor stuck on "no binary loaded" despite a successful load;
# sidebar collapsing to 0 width under CSS containment; the hand-rolled
# virtual scroll dropped entirely after two failed fix attempts, replaced
# with a full render + native CSS content-visibility) -- worth shipping
# now rather than waiting for the next tagged Fission release. Switch
# back to `tag = "vX.Y.Z"` (dropping `rev`) once a release containing
# these fixes ships.
#
# Bumped again past the above fixes to pick up (in order): a WASM clipboard
# copy bug (button claimed success without ever writing anything on wasm32),
# a command-palette navigation that broke Back/Forward history, string-click
# not actually scrolling the Hex tab to the target offset, click-to-navigate
# for `sub_XXXX` references inside decompiled pseudocode, find-bar next/prev
# match navigation, and -- the reason for this particular bump -- real lag
# with ~15k+ functions in one binary: content-visibility alone only ever
# helped paint cost for off-screen rows, not the VNode construction/diffing
# cost of the *full* list on every render. The sidebar now incrementally
# mounts rows in batches as the user scrolls, append-only (never removing or
# repositioning already-rendered rows), which is what let this reintroduce
# windowed rendering without the scroll-position-fighting failure modes that
# killed the two earlier virtual-scroll attempts referenced above.
fission-ui = { git = "https://github.com/fission-systems/Fission", rev = "47e340829f494daa5bc75285405aa7a7a14c9104", default-features = false }

[profile.release]
opt-level = "z"     # minimize WASM size
lto = true
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
