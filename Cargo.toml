[package]
name = "fission-web"
version = "0.1.0"
edition = "2021"
description = "Fission decompiler — browser-native interface (Dioxus WASM)"
repository = "https://github.com/fission-systems/fission-web"
license = "AGPL-3.0-or-later"

[[bin]]
name = "fission-web"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-logger = "0.7"
tracing = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "File", "FileList", "FileReader",
  "HtmlInputElement", "Event", "EventTarget",
  "DragEvent", "DataTransfer",
  "ProgressEvent",
  "console",
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = { version = "0.6", features = ["http"] }
console_error_panic_hook = "0.1"

# Fission shared UI — git dependency (includes state, engine, components).
# Pinned to an exact commit, not `main` HEAD: fission-web now deploys per
# Fission release, not on every push. `fission-ui` didn't exist yet as of
# the last cut release (v0.1.6), so there's no tag to pin to until v0.1.7
# ships -- switch this to `tag = "v0.1.7"` (dropping `rev`) at that point,
# and re-tag fission-web to match.
fission-ui = { git = "https://github.com/fission-systems/Fission", rev = "f0dec1f779ca46feb90b6c73c519053c8bbadaf8", default-features = false }

[profile.release]
opt-level = "z"     # minimize WASM size
lto = true
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
