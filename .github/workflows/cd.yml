name: CD Deploy

# fission-web deploys on every push to main -- pure presentation-layer
# changes (UI, copy, this app's own components) are low-risk and shouldn't
# wait on a Fission release tag. This is decoupled from fission-ui's own
# version: Cargo.toml pins `fission-ui` to a specific Fission release tag
# regardless of when this deploys, so new Fission-side functionality only
# reaches production when that pin is deliberately bumped, not on every
# push here. Railway's own GitHub auto-deploy is disabled -- this is the
# only thing that ships production, to avoid a double deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy-railway-web:
    name: 🚂 Deploy fission-web (Railway)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service fission-web --ci --yes
